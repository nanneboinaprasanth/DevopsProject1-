version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
    container_name: devops-app
    environment:
      - APP_ENV=development
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge